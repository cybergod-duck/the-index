<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="title">
      <svg
        version="1.1"
        xmlns="http://www.w3.org/2000/svg"
        xmlns:xlink="http://www.w3.org/1999/xlink"
        x="0px"
        y="0px"
        width="60"

    <div

      id="settings"
      style="

        display: flex;
        flex-direction: column;
        flex-wrap: nowrap;
        align-content: center;
        justify-content: center;
        align-items: center;
      "
    >
      <a class="help" href="help.html">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          height="18px"
          viewBox="0 0 24 24"
          width="18px"

          flex-direction: column;

        "

          <a>Persistent zoom mode</a>
          <div class="button-wrap" style="margin-bottom: 0px">

          <a class="button" id="playerButtonAR"></a>
        </div>
        <div class="button-wrap">
          <a>Zoom transition speed</a>
          <a class="button" id="transitionSpeed"></a>
        </div>
      </div>
      <a
        class="button"
        id="shortcuts"
        href="shortcuts.html"
        style="width: 185px; margin-top: 3px"
        >Change single key shortcuts</a
      >
    </div>
    <footer>
      <a class="button" href="index.html">◀️ Go Back</a>
      <a class="button" href="donate.html">Support the developer ❤️</a>
